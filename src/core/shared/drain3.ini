# Drain3 configuration used for research evaluation.
# The key choice here is that masking is handled upstream in code, so this file
# mainly fixes the parser tree behavior for reproducible clustering.
[DRAIN]
# ---- Clustering parameters ----
# Similarity threshold chosen to match the evaluation setting reported in the paper.
sim_th = 0.39

# Keep both names for compatibility across Drain3 versions.
max_node_depth = 6
depth = 6

# Retain the library default unless a dataset requires a tighter tree.
max_children = 100

[MASKING]
# ---- Masking ----
# Leave empty because tokens are already masked before reaching Drain3.
masking = []
mask_prefix = <
mask_suffix = >
